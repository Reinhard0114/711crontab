name: 7-11 Stock Monitor

on:
  # 排程已暫停 (若需重啟請取消註解)
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: '發送測試推播至 Discord (確認 Secret 設定是否成功)'
        required: false
        type: boolean
        default: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 利用 Cache 儲存與還原最新庫存狀態
      - name: Restore Stock State Cache
        uses: actions/cache/restore@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Run Stock Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "✅ 成功讀取到 DISCORD_WEBHOOK_URL Secret"
          else
            echo "⚠️ 未設定 DISCORD_WEBHOOK_URL Secret，通知將無法送達"
          fi

          if [ "${{ inputs.test_notify }}" = "true" ]; then
            echo "📢 執行測試通知模式..."
            python3 monitor.py --test-notify
          else
            echo "🔍 執行一般庫存檢查..."
            python3 monitor.py --once
          fi

      - name: Save Stock State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}

